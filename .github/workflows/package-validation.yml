name: package-validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/package-validation.yml'
      - '.github/workflows/release.yml'
      - 'installer/**'
      - 'src/**'
      - 'tests/**'

jobs:
  validate-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\GameLauncher.sln

      - name: Run full tests
        run: dotnet run --project .\tests\GameLauncher.Tests\GameLauncher.Tests.csproj -c Release

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish .\src\GameLauncher.App\GameLauncher.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=1.0.0 `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -o .\publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=1.0.0" `
            "/DPublishDir=$pwd\publish" `
            ".\installer\GameLauncher.iss"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* `
            -DestinationPath .\artifacts\GameLauncher-Portable-win-x64.zip `
            -Force

      - name: Verify artifacts
        shell: pwsh
        run: |
          $installer = Get-Item .\artifacts\GameLauncher-Setup.exe
          $portable = Get-Item .\artifacts\GameLauncher-Portable-win-x64.zip
          if ($installer.Length -lt 1000000) { throw "Installer is unexpectedly small." }
          if ($portable.Length -lt 1000000) { throw "Portable ZIP is unexpectedly small." }
          Write-Host "Installer bytes: $($installer.Length)"
          Write-Host "Portable ZIP bytes: $($portable.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: game-launcher-v1-package-validation
          path: |
            artifacts/GameLauncher-Setup.exe
            artifacts/GameLauncher-Portable-win-x64.zip
