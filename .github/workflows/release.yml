name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
            $version = $releaseTag.TrimStart("v")
          }
          else {
            [xml]$project = Get-Content .\src\GameLauncher.App\GameLauncher.App.csproj
            $version = [string]$project.Project.PropertyGroup.Version
            $releaseTag = "v$version"
          }

          try {
            [void][Version]$version
          }
          catch {
            throw "Resolved version '$version' is not a valid release version."
          }

          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore .\GameLauncher.sln

      - name: Launcher tests
        run: dotnet run --project .\tests\GameLauncher.Tests\GameLauncher.Tests.csproj -c Release

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish .\src\GameLauncher.App\GameLauncher.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -o .\publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DPublishDir=$pwd\publish" `
            ".\installer\GameLauncher.iss"

      - name: Create installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\artifacts\GameLauncher-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GameLauncher-Setup.exe" | Set-Content -Encoding ascii .\artifacts\GameLauncher-Setup.exe.sha256

      - name: Build portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* `
            -DestinationPath .\artifacts\GameLauncher-Portable-win-x64.zip `
            -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = ".\docs\releases\$env:RELEASE_TAG.md"

          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            ".\artifacts\GameLauncher-Setup.exe",
            ".\artifacts\GameLauncher-Setup.exe.sha256",
            ".\artifacts\GameLauncher-Portable-win-x64.zip",
            "--target", "${{ github.sha }}",
            "--title", "My Game Launcher $env:RELEASE_TAG"
          )

          if (Test-Path $notesPath) {
            $arguments += @("--notes-file", $notesPath)
          }
          else {
            $arguments += "--generate-notes"
          }

          gh @arguments
