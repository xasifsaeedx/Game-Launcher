name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          try { [void][Version]$version } catch { throw "Tag must be a version like v1.0.0" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore .\GameLauncher.sln

      - name: Run tests
        run: dotnet run --project .\tests\GameLauncher.Tests\GameLauncher.Tests.csproj -c Release

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish .\src\GameLauncher.App\GameLauncher.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -o .\publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DPublishDir=$pwd\publish" `
            ".\installer\GameLauncher.iss"

      - name: Create installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\artifacts\GameLauncher-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GameLauncher-Setup.exe" | Set-Content -Encoding ascii .\artifacts\GameLauncher-Setup.exe.sha256

      - name: Build portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* `
            -DestinationPath .\artifacts\GameLauncher-Portable-win-x64.zip `
            -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\artifacts\GameLauncher-Setup.exe" `
            ".\artifacts\GameLauncher-Setup.exe.sha256" `
            ".\artifacts\GameLauncher-Portable-win-x64.zip" `
            --title "My Game Launcher ${{ github.ref_name }}" `
            --generate-notes
